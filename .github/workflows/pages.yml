name: Publish GameSystems Documentation

on:
  push:
    branches: [main]
    paths:
      - "Assets/GameSystems/**"
      - "Documentation/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gamesystems-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate API reference
        run: ruby Documentation/generate-api.rb
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Documentation
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
